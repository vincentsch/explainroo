<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>explainroo preview</title>
<style>
  :root { --bg: #111318; --panel: #1a1d24; --line: #2a2f3a; --fg: #e7eaf0; --muted: #8b93a3; --accent: #ffb347; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 260px; grid-template-rows: 1fr auto; height: 100%; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 0; }
  #stage canvas { max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.45); border-radius: 4px; background: #000; }
  #side { grid-row: 1 / 3; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px; }
  #side h1 { font-size: 15px; margin: 0 0 4px; }
  #side .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .scene { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font: inherit; }
  .scene:hover { background: #222632; }
  .scene.on { border-color: var(--accent); background: #262219; }
  .scene b { display: block; font-size: 13px; }
  .scene span { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar { grid-column: 1; display: flex; gap: 12px; align-items: center; padding: 10px 20px 16px; }
  #bar button { background: var(--accent); color: #1a1407; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; min-width: 74px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  #track { position: relative; flex: 1; height: 34px; cursor: pointer; }
  #track .seg { position: absolute; top: 8px; height: 18px; border-radius: 4px; background: #2a2f3a; border: 1px solid #353b48; overflow: hidden; color: var(--muted); font-size: 11px; padding: 1px 5px; white-space: nowrap; }
  #track .head { position: absolute; top: 2px; width: 2px; height: 30px; background: var(--accent); pointer-events: none; }
  #status { color: var(--muted); font-size: 12px; min-width: 150px; text-align: right; }
  #error { position: absolute; left: 20px; right: 20px; bottom: 20px; background: #3a1418; border: 1px solid #a33; color: #ffd6d6; padding: 12px 14px; border-radius: 8px; white-space: pre-wrap; font: 13px/1.45 ui-monospace, monospace; display: none; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.7; }
  kbd { background: #2a2f3a; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div id="error"></div></div>
  <div id="side">
    <h1 id="title">explainroo</h1>
    <div class="sub" id="meta"></div>
    <div id="scenes"></div>
    <div class="keys"><kbd>space</kbd> play / pause<br><kbd>←</kbd> <kbd>→</kbd> one second<br><kbd>,</kbd> <kbd>.</kbd> one frame<br><kbd>[</kbd> <kbd>]</kbd> previous / next scene<br>Saving script.md or scenes.js reloads.</div>
  </div>
  <div id="bar">
    <button id="play">Play</button>
    <div id="time">0.00 / 0.00</div>
    <div id="track"><div class="head" id="head"></div></div>
    <div id="status"></div>
  </div>
</div>
<script type="module">
import { boot, renderAudio, fetchState } from '/engine/runtime.js';

const canvas = document.getElementById('c');
const $ = (id) => document.getElementById(id);
let engine = null;
let audioMod = null;
let state = null;
let T = 0;
let playing = false;
let actx = null;
let source = null;
let startedAt = 0;
let mix = null;
let mixVersion = null;
let clockStart = 0;

function setStatus(s) { $('status').textContent = s; }
function showError(msg) { $('error').style.display = msg ? 'block' : 'none'; $('error').textContent = msg || ''; }

function draw() {
  if (!engine) return;
  try {
    engine.renderFrame(Math.min(T, state.timeline.duration - 1 / state.config.fps));
    showError(state.error ? 'script error: ' + state.error : '');
  } catch (e) {
    showError(`scene "${e.scene ?? '?'}" at ${e.sceneTime !== undefined ? Number(e.sceneTime).toFixed(2) + 's' : '?'}:\n${e.message}`);
  }
  const d = state.timeline.duration;
  $('time').textContent = `${T.toFixed(2)} / ${d.toFixed(2)}`;
  $('head').style.left = `${(T / d) * 100}%`;
  const i = engine.sceneAt(T);
  document.querySelectorAll('.scene').forEach((el, k) => el.classList.toggle('on', k === i));
}

function buildUi() {
  const tl = state.timeline;
  $('title').textContent = state.title || 'explainroo';
  $('meta').textContent = `${state.config.theme} · ${state.config.width}x${state.config.height} · ${tl.duration.toFixed(1)}s · ${state.config.voice}`;
  $('scenes').innerHTML = '';
  $('track').querySelectorAll('.seg').forEach((s) => s.remove());
  for (const sc of tl.scenes) {
    const b = document.createElement('button');
    b.className = 'scene';
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector('b').textContent = `${sc.id}  ${sc.start.toFixed(1)}s`;
    b.querySelector('span').textContent = sc.text || '(no narration)';
    b.onclick = () => seek(sc.start + 0.001);
    $('scenes').appendChild(b);
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.left = `${(sc.start / tl.duration) * 100}%`;
    seg.style.width = `calc(${(sc.dur / tl.duration) * 100}% - 2px)`;
    seg.textContent = sc.id;
    $('track').insertBefore(seg, $('head'));
  }
}

async function load(version) {
  const scale = Math.min(1, 1280 / (await fetchState()).config.width);
  const r = await boot({ canvas, scale, version });
  if (engine) {
    engine.onClipFrame = null;
    engine.clipFrames.close();
  }
  engine = r.engine;
  engine.onClipFrame = draw;
  audioMod = r.audio;
  state = r.state;
  buildUi();
  draw();
  refreshAudio();
}

async function refreshAudio() {
  if (!actx) return;
  const v = state.version;
  setStatus('mixing sound…');
  try {
    const { buffer } = await renderAudio(engine, audioMod);
    if (state.version !== v) return;
    mix = buffer;
    mixVersion = v;
    setStatus('');
    if (playing) { stopSource(); startSource(); }
  } catch (e) {
    setStatus('sound failed');
    showError('sound: ' + e.message);
  }
}

function startSource() {
  if (!mix || !actx) { clockStart = performance.now() / 1000 - T; return; }
  source = actx.createBufferSource();
  source.buffer = mix;
  source.connect(actx.destination);
  source.start(0, Math.min(T, mix.duration - 0.01));
  startedAt = actx.currentTime - T;
}
function stopSource() { if (source) { try { source.stop(); } catch {} source = null; } }

function tick() {
  if (playing) {
    T = source ? actx.currentTime - startedAt : performance.now() / 1000 - clockStart;
    if (T >= state.timeline.duration) { T = state.timeline.duration; pause(); }
    draw();
  }
  requestAnimationFrame(tick);
}

async function play() {
  if (!actx) { actx = new AudioContext(); await refreshAudio(); }
  if (T >= state.timeline.duration - 0.05) T = 0;
  playing = true;
  $('play').textContent = 'Pause';
  startSource();
}
function pause() { playing = false; stopSource(); $('play').textContent = 'Play'; draw(); }
function seek(t) { T = Math.max(0, Math.min(state.timeline.duration, t)); if (playing) { stopSource(); startSource(); } draw(); }

$('play').onclick = () => (playing ? pause() : play());
$('track').onclick = (e) => { const r = $('track').getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * state.timeline.duration); };
window.addEventListener('keydown', (e) => {
  if (!state) return;
  const f = 1 / state.config.fps;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') seek(T + 1);
  else if (e.key === 'ArrowLeft') seek(T - 1);
  else if (e.key === '.') seek(T + f);
  else if (e.key === ',') seek(T - f);
  else if (e.key === ']' || e.key === '[') {
    const i = engine.sceneAt(T);
    const j = Math.max(0, Math.min(state.timeline.scenes.length - 1, i + (e.key === ']' ? 1 : -1)));
    seek(state.timeline.scenes[j].start + 0.001);
  }
});

let failed = null;
async function poll() {
  let s;
  try {
    s = await fetchState();
  } catch {
    setStatus('preview server stopped');
    setTimeout(poll, 1500);
    return;
  }
  const changed = !state || s.version !== state.version || s.error !== state.error;
  if (changed && s.version !== failed) {
    try {
      const keep = T;
      await load(s.version);
      failed = null;
      if (s.error) state.error = s.error;
      seek(keep);
    } catch (e) {
      failed = s.version;
      showError(e.message);
    }
  }
  setTimeout(poll, 800);
}

load().catch((e) => showError(e.message)).finally(() => { requestAnimationFrame(tick); setTimeout(poll, 800); });
</script>
</body>
</html>
